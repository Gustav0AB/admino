services:
  postgres:
    image: postgres:16-alpine
    container_name: admino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admino
      POSTGRES_PASSWORD: admino
      POSTGRES_DB: admino_dev
    ports:
      - "5432:5432"
    volumes:
      - admino_postgres_data:/var/lib/postgresql/data

volumes:
  admino_postgres_data:
